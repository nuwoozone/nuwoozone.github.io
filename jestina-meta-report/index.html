<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https:; frame-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>J.ESTINA Meta 댓글 리포트</title>
  <style>
    :root{--wine:#6b245c;--rose:#9b2f59;--paper:#faf7f9;--ink:#241e23;--muted:#746c73;--line:#e3d9e0}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Malgun Gothic",sans-serif}
    .gate{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#fff 0,#f7eff4 48%,#efe6ec 100%)}
    .card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 18px 60px rgba(79,38,66,.12)}
    .brand{color:var(--wine);font-size:13px;font-weight:800;letter-spacing:.16em}h1{font-size:25px;margin:12px 0 8px}p{color:var(--muted);line-height:1.6;margin:0 0 22px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #cdbfc9;border-radius:10px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(155,47,89,.12)}
    button{border:0;border-radius:10px;padding:13px 16px;font-size:14px;font-weight:800;cursor:pointer;background:var(--wine);color:#fff}button:disabled{opacity:.55;cursor:wait}.primary{width:100%;margin-top:12px}
    .error{min-height:22px;color:#b42346;font-size:13px;margin-top:10px}.meta{font-size:11px;color:#948991;margin-top:18px}
    .workspace{display:none;height:100%;grid-template-rows:auto 1fr;background:#fff}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
    .toolbar strong{font-size:14px}.toolbar-actions{display:flex;gap:8px}.secondary{background:#f3ebf0;color:var(--wine);padding:9px 12px}iframe{width:100%;height:100%;border:0;background:#fff}
    @media(max-width:560px){.card{padding:24px 20px}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main id="gate" class="gate">
    <section class="card">
      <div class="brand">J.ESTINA · META REPORT</div>
      <h1>암호화된 댓글 리포트</h1>
      <p>승인된 담당자만 비밀번호로 리포트를 열 수 있습니다. 비밀번호는 이 브라우저에 저장되지 않습니다.</p>
      <form id="unlock-form">
        <label for="password">리포트 비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" minlength="16" required autofocus>
        <button id="unlock" class="primary" type="submit">리포트 열기</button>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
      </form>
      <div class="meta">암호문 갱신: 2026-08-28 13:47 KST</div>
    </section>
  </main>
  <main id="workspace" class="workspace">
    <header class="toolbar">
      <strong>J.ESTINA Meta 댓글 리포트</strong>
      <div class="toolbar-actions">
        <button id="download" class="secondary" type="button">CSV 다운로드</button>
        <button id="lock" class="secondary" type="button">잠그기</button>
      </div>
    </header>
    <iframe id="report" title="댓글 검토 리포트" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
  </main>

  <script>
    (() => {
      'use strict';
      const payload = JSON.parse(document.getElementById('encrypted-payload').textContent);
      const encoder = new TextEncoder();
      const decoder = new TextDecoder('utf-8', {fatal:true});
      const gate = document.getElementById('gate');
      const workspace = document.getElementById('workspace');
      const form = document.getElementById('unlock-form');
      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const error = document.getElementById('error');
      const frame = document.getElementById('report');
      const download = document.getElementById('download');
      let csvObjectUrl = null;

      const bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
      async function derive(password) {
        const material = await crypto.subtle.importKey('raw', encoder.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:bytes(payload.kdf.salt),iterations:payload.kdf.iterations,hash:payload.kdf.hash},
          material,
          {name:'AES-GCM',length:256},
          false,
          ['decrypt']
        );
      }
      async function decrypt(key, name) {
        const doc = payload.documents[name];
        const plain = await crypto.subtle.decrypt(
          {name:'AES-GCM',iv:bytes(doc.iv),additionalData:encoder.encode('jestina-meta-report:v1:' + name),tagLength:128},
          key,
          bytes(doc.ciphertext)
        );
        return new Uint8Array(plain);
      }
      function relock() {
        frame.removeAttribute('srcdoc');
        if (csvObjectUrl) URL.revokeObjectURL(csvObjectUrl);
        csvObjectUrl = null;
        input.value = '';
        workspace.style.display = 'none';
        gate.style.display = 'grid';
        input.focus();
      }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;
        button.textContent = '확인 중…';
        try {
          const key = await derive(input.value);
          const [htmlBytes, csvBytes] = await Promise.all([decrypt(key,'html'),decrypt(key,'csv')]);
          const htmlText = decoder.decode(htmlBytes);
          const csvBlob = new Blob([csvBytes], {type:'text/csv;charset=utf-8'});
          csvObjectUrl = URL.createObjectURL(csvBlob);
          frame.srcdoc = htmlText;
          input.value = '';
          gate.style.display = 'none';
          workspace.style.display = 'grid';
        } catch (_) {
          error.textContent = '비밀번호가 올바르지 않거나 리포트가 손상되었습니다.';
          input.select();
        } finally {
          button.disabled = false;
          button.textContent = '리포트 열기';
        }
      });
      download.addEventListener('click', () => {
        if (!csvObjectUrl) return;
        const link = document.createElement('a');
        link.href = csvObjectUrl;
        link.download = 'jestina-meta-comment-report.csv';
        link.click();
      });
      document.getElementById('lock').addEventListener('click', relock);
    })();
  </script>
