  <script>
    (() => {
      'use strict';
      const payload = JSON.parse(document.getElementById('encrypted-payload').textContent);
      const encoder = new TextEncoder();
      const decoder = new TextDecoder('utf-8', {fatal:true});
      const gate = document.getElementById('gate');
      const workspace = document.getElementById('workspace');
      const form = document.getElementById('unlock-form');
      const input = document.getElementById('password');
      const button = document.getElementById('unlock');
      const error = document.getElementById('error');
      const frame = document.getElementById('report');
      const download = document.getElementById('download');
      let csvObjectUrl = null;

      const bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
      async function derive(password) {
        const material = await crypto.subtle.importKey('raw', encoder.encode(password.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:bytes(payload.kdf.salt),iterations:payload.kdf.iterations,hash:payload.kdf.hash},
          material,
          {name:'AES-GCM',length:256},
          false,
          ['decrypt']
        );
      }
      async function decrypt(key, name) {
        const doc = payload.documents[name];
        const plain = await crypto.subtle.decrypt(
          {name:'AES-GCM',iv:bytes(doc.iv),additionalData:encoder.encode('jestina-meta-report:v1:' + name),tagLength:128},
          key,
          bytes(doc.ciphertext)
        );
        return new Uint8Array(plain);
      }
      function relock() {
        frame.removeAttribute('srcdoc');
        if (csvObjectUrl) URL.revokeObjectURL(csvObjectUrl);
        csvObjectUrl = null;
        input.value = '';
        workspace.style.display = 'none';
        gate.style.display = 'grid';
        input.focus();
      }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        button.disabled = true;
        button.textContent = '확인 중…';
        try {
          const key = await derive(input.value);
          const [htmlBytes, csvBytes] = await Promise.all([decrypt(key,'html'),decrypt(key,'csv')]);
          const htmlText = decoder.decode(htmlBytes);
          const csvBlob = new Blob([csvBytes], {type:'text/csv;charset=utf-8'});
          csvObjectUrl = URL.createObjectURL(csvBlob);
          frame.srcdoc = htmlText;
          input.value = '';
          gate.style.display = 'none';
          workspace.style.display = 'grid';
        } catch (_) {
          error.textContent = '비밀번호가 올바르지 않거나 리포트가 손상되었습니다.';
          input.select();
        } finally {
          button.disabled = false;
          button.textContent = '리포트 열기';
        }
      });
      download.addEventListener('click', () => {
        if (!csvObjectUrl) return;
        const link = document.createElement('a');
        link.href = csvObjectUrl;
        link.download = 'jestina-meta-comment-report.csv';
        link.click();
      });
      document.getElementById('lock').addEventListener('click', relock);
    })();
  </script>
